services:
  # -------------------------------------------------------------
  # Backend: FastAPI Async Microservice
  # -------------------------------------------------------------
  - type: web
    name: lenny-growth-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/ingest.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEFAULT_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Optional: Connect to Render Postgres by uncommenting below
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: lenny-postgres
      #     property: connectionString

  # -------------------------------------------------------------
  # Frontend: React + Vite Static Web Application
  # -------------------------------------------------------------
  - type: web
    name: lenny-growth-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lenny-growth-backend
          property: host

# Optional Managed PostgreSQL with pgvector support
# databases:
